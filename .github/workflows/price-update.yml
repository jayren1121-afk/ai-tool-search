# 價格資料每日更新（台灣時間每天 20:27 自動執行，也可手動按 Run workflow）
# - 程式在 main 分支的 price-scraper/；進度與結果存到獨立的 price-data 分支（不會推到 main，不會觸發網站正式部署）
# - 所有有真實價格（含來源網址、擷取日期、逐字原文）的結果都自動寫進網站資料庫並上線（含備援 AI、有疑點的）；不對的到 /admin「價格」區塊拒絕
# - 金鑰放在 Settings > Secrets and variables > Actions：GROQ_API_KEY、OPENROUTER_API_KEY、SUPABASE_URL、SUPABASE_SERVICE_ROLE_KEY（選填：GEMINI_API_KEY、CEREBRAS_API_KEY、MISTRAL_API_KEY）
name: 價格資料每日更新

on:
  schedule:
    - cron: "0 4 * * *"   # UTC 04:00 = 台灣時間 12:00
  workflow_dispatch:
    inputs:
      new_round:
        description: "開始新一輪（把舊進度封存，全部重新抓取＋整理；平常不要勾）"
        type: boolean
        default: false
      llm_limit:
        description: "本次最多整理幾頁（空白＝不限制，測試時可填 3）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: price-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      DATA_BRANCH: price-data
      PRICE_DATA_DIR: ${{ github.workspace }}/data
      TZ: Asia/Taipei
    steps:
      - name: 取得程式（main）
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 準備 price-data 分支（第一次會用 seed 自動建立）
        run: |
          set -euo pipefail
          git config --global user.name "price-bot"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null 2>&1; then
            git fetch --depth=1 origin "$DATA_BRANCH:$DATA_BRANCH"
            git worktree add "$PRICE_DATA_DIR" "$DATA_BRANCH"
            echo "已取得既有的 $DATA_BRANCH 分支"
          else
            git worktree add --detach "$PRICE_DATA_DIR"
            cd "$PRICE_DATA_DIR"
            git checkout --orphan "$DATA_BRANCH"
            git rm -rfq . || true
            git clean -fdxq
            if [ -f "$GITHUB_WORKSPACE/price-scraper/seed/checkpoint-seed.tar.gz" ]; then
              tar -xzf "$GITHUB_WORKSPACE/price-scraper/seed/checkpoint-seed.tar.gz"
              echo "已用 seed 建立 $DATA_BRANCH（快照時間：$(cat SNAPSHOT_TIME.txt 2>/dev/null)）"
            fi
          fi
          cd "$PRICE_DATA_DIR"
          # 這個分支不需要 Vercel 部署：放一個只關閉部署的 vercel.json
          printf '%s\n' '{' '  "$schema": "https://openapi.vercel.sh/vercel.json",' '  "git": { "deploymentEnabled": false }' '}' > vercel.json
          printf '%s\n' '# price-data（自動產生，請勿手動修改）' '' '這個分支只放價格整理的進度與結果，由 GitHub Actions「價格資料每日更新」自動更新。' '' '- progress.md：最新進度' '- report.md：完整報告' '- price_snapshots_import.sql / price_snapshots_approve_safe.sql / price_snapshots_review_list.md：給人工核准用' '- scrape.jsonl、llm.jsonl、text/：進度存檔（checkpoint），刪掉就會重跑' > README.md

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: price-scraper/requirements.txt

      - name: 安裝 Playwright 與 Chromium
        run: |
          pip install -r price-scraper/requirements.txt
          python -m playwright install --with-deps chromium

      - name: 抓取價格頁＋AI 整理＋產生報告
        timeout-minutes: 130
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || secrets.OPENROUTER_MODEL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          CEREBRAS_MODEL: ${{ vars.CEREBRAS_MODEL }}
          MISTRAL_MODEL: ${{ vars.MISTRAL_MODEL }}
          LLM_PROVIDERS: ${{ vars.LLM_PROVIDERS }}
          LLM_LIMIT: ${{ github.event.inputs.llm_limit }}
          NEW_ROUND: ${{ github.event.inputs.new_round == 'true' && '1' || '0' }}
          RUN_MAX_MIN: "115"
          SCRAPE_MAX_MIN: "70"
          RESCRAPE_PER_RUN: ${{ vars.RESCRAPE_PER_RUN }}
          BILLING_TOGGLE: ${{ vars.BILLING_TOGGLE }}
        run: bash price-scraper/run_actions.sh

      - name: 價格自動上線（全部有價格的結果）
        # 需要 GitHub Secrets：SUPABASE_URL、SUPABASE_SERVICE_ROLE_KEY（沒設定就自動略過，不算失敗）
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 price-scraper/publish_prices.py

      - name: 存檔到 price-data 分支
        if: always()
        run: |
          set -euo pipefail
          cd "$PRICE_DATA_DIR"
          git add -A
          if git diff --cached --quiet; then
            echo "沒有變更需要存檔"
            exit 0
          fi
          git commit -q -m "價格資料更新 $(date '+%Y-%m-%d %H:%M') [skip ci]"
          for i in 1 2 3; do
            if git push origin "HEAD:refs/heads/$DATA_BRANCH"; then echo "已存檔到 $DATA_BRANCH"; exit 0; fi
            sleep $((i*10))
          done
          echo "::error::存檔失敗（push 到 $DATA_BRANCH 失敗），請看上方訊息"
          exit 1
